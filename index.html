<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDIVIC - SaaS Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: '#000000', // Pure Black
              surface: '#0a0a0a',    // Very dark gray
              primary: {
                400: '#fbbf24', // Amber 400
                500: '#d4af37', // Gold
                600: '#b4941f', // Dark Gold
              },
              secondary: {
                400: '#a1a1aa', // Zinc 400
                500: '#71717a', // Zinc 500
              },
              gold: {
                light: '#fde68a',
                DEFAULT: '#d4af37',
                dark: '#b4941f',
                glow: 'rgba(212, 175, 55, 0.5)'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: #000000;
        color: #f8fafc;
      }
      
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Space Grotesk', sans-serif;
      }

      .glass {
        background: rgba(10, 10, 10, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(212, 175, 55, 0.1);
      }

      /* Gold Gradient Text */
      .text-gold-gradient {
        background: linear-gradient(to right, #fde68a, #d4af37, #fde68a);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        background-size: 200% auto;
        animation: shine 4s linear infinite;
      }

      @keyframes shine {
        to {
          background-position: 200% center;
        }
      }

      /* Gold Particle Background */
      .gold-dust-bg {
        background-color: #000000;
        background-image: 
          radial-gradient(circle at 50% 100%, rgba(212, 175, 55, 0.2) 0%, transparent 50%),
          radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
          radial-gradient(#d4af37, rgba(212, 175, 55,.15) 1px, transparent 2px);
        background-size: 100% 100%, 550px 550px, 350px 350px;
        background-position: 0 0, 0 0, 0 0;
      }

      .gold-border {
        border: 1px solid #d4af37;
      }
      
      .gold-glow {
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
      }
      
      .nav-link-active {
        position: relative;
        color: #d4af37;
      }
      
      .nav-link-active::after {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 0;
        width: 100%;
        height: 2px;
        background: #d4af37;
        box-shadow: 0 0 8px #d4af37;
      }

      /* Disable Text Selection Globally */
      * {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      /* Custom Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.02);
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(212, 175, 55, 0.5);
      }
    </style>
    <script>
      // Disable Right Click
      document.addEventListener('contextmenu', event => event.preventDefault());

      // Disable Copy Shortcut (Ctrl+C)
      document.addEventListener('keydown', function(event) {
        if (event.ctrlKey && (event.key === 'c' || event.key === 'C')) {
          event.preventDefault();
        }
      });
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.575.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-background text-slate-50 antialiased selection:bg-primary-500 selection:text-white">

</body>
</html>
